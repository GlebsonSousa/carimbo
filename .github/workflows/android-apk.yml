# Compila o APK de graça nos servidores do GitHub a cada envio de código.
# O APK fica em: Releases > "Carimbo (última versão)" > carimbo.apk
name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Gerar projeto Android
        run: npx expo prebuild -p android --no-install

      - name: Compilar APK
        working-directory: android
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk carimbo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest carimbo.apk \
            --title "Carimbo (última versão)" \
            --notes "Gerado em $(date -u '+%d/%m/%Y %H:%M') UTC, versão ${GITHUB_SHA::7}."
